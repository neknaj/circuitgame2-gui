name: GUI checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Windows GUI and workspace tests
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --locked --workspace
      - run: cargo build --locked -p circuitgame2-gui --bin ncg2-gui

  wasm:
    name: Browser builds and Pages artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - run: cargo build --locked --release --workspace --lib --target wasm32-unknown-unknown
      - name: Generate bindings for the separate browser prototype
        run: wasm-bindgen --target web --out-dir site/pkg target/wasm32-unknown-unknown/release/circuitgame2_web.wasm
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site/fonts
          cp crates/gui/web/{index.html,start.js} _site/
          cp crates/gui/web/fonts/OFL.txt _site/fonts/
          wasm-bindgen --target web --out-dir _site/pkg target/wasm32-unknown-unknown/release/circuitgame2_gui.wasm
      - name: Check CLI snapshot round-trip in Chrome
        run: python3 crates/gui/tests/browser_snapshot/run.py _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [native, wasm]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
