[package]
name = "circuitgame2-gpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

description = "デスクトップ GPU で順序 NOR 回路を並列に実行する"
license = "MIT"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "vulkan", "wgsl"] }
circuitgame2-core.workspace = true
bytemuck = "=1.25.2"
pollster = "=0.4.0"
