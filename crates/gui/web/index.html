<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neknaj Circuit Game 2</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; }
    #project-controls { padding: .4rem .5rem; }
    canvas { flex: 1; min-height: 0; display: block; width: 100%; height: 100%; }
    canvas[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="project-controls" hidden>
    <label for="folder">Open project folder</label>
    <input id="folder" type="file" webkitdirectory>
    <button id="export-snapshot" type="button">Download snapshot</button>
    <label for="import-snapshot">Restore snapshot</label>
    <input id="import-snapshot" type="file">
    <span id="project-status" role="status"></span>
  </div>
  <canvas id="workbench" aria-label="Neknaj Circuit Game 2"></canvas>
  <p id="status" role="status" hidden></p>
  <script type="module" src="start.js"></script>
</body>
</html>
