[package]
name = "circuitgame2-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "NCG2 の順序回路をブラウザーで実行する"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
circuitgame2-core = { version = "0.1.0", git = "https://github.com/neknaj/circuitgame2-core", rev = "9b10e7c8c77185e724d8280ea79853d628b3901b" }
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
