[workspace]
members = ["crates/gui", "crates/gpu"]
default-members = ["."]
resolver = "3"

[workspace.dependencies]
circuitgame2-core = { version = "0.1.0", git = "https://github.com/neknaj/circuitgame2-core", rev = "d9a37eef1ec91701dfe372fe0fc0d6ebd5d98cba" }

[package]
name = "circuitgame2-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "NCG2 の順序回路をブラウザーで実行する"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
circuitgame2-core.workspace = true
circuitgame2-project-config = { version = "0.1.0", git = "https://github.com/neknaj/circuitgame2-core", rev = "d9a37eef1ec91701dfe372fe0fc0d6ebd5d98cba" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
